name: Crypto Checkpoint Data Refresh

on:
  workflow_dispatch:
  schedule:
    # Off-peak minutes (not :00/:15/:30/:45). GitHub delays or drops scheduled runs
    # under load, and the round-number minutes are the busiest.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: crypto-checkpoint-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update crypto market data
        run: python scripts/update_data.py

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update crypto market snapshots"
            git push
          fi
