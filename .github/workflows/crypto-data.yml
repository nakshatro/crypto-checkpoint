name: Crypto Checkpoint Data Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/crypto-data.yml"
      - "cloud-predictor/worker/collector.py"
      - "cloud-predictor/docs/index.html"
  schedule:
    # Refresh twice per hour; GitHub Actions schedules are best-effort.
    # A push to this workflow file also triggers an immediate refresh.
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: crypto-checkpoint-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check worker and dashboard syntax
        run: |
          python -m py_compile cloud-predictor/worker/collector.py
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path("cloud-predictor/worker/collector.py").read_text(encoding="utf-8"))
          names = {n.name for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          assert "automatic_macro_events" in names
          assert "global_model_context" in names
          assert "main" in names
          print("Worker syntax and automatic macro calendar hooks validated.")
          PY
          python -c 'from pathlib import Path; h=Path("cloud-predictor/docs/index.html").read_text(encoding="utf-8"); Path("/tmp/forecast-lab.js").write_text(h.split("<script>",1)[1].split("</script>",1)[0],encoding="utf-8")'
          node --check /tmp/forecast-lab.js

      - name: Update existing crypto market data
        run: python scripts/update_data.py

      - name: Install forecast worker dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Generate cloud forecast data
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_FORCE_SEND: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: python cloud-predictor/worker/collector.py

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json cloud-predictor/docs/data/*.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update crypto market and forecast snapshots"
            git pull --rebase origin main
            git push
          fi
