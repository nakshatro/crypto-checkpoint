name: Crypto Checkpoint Walk-Forward Backtest

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Crypto Checkpoint Free Historical Backfill"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: crypto-walk-forward-backtest
  cancel-in-progress: false

jobs:
  backtest:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and run walk-forward backtest
        run: |
          python -m py_compile scripts/walk_forward_backtest.py
          python scripts/walk_forward_backtest.py
      - name: Commit report and prediction archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historical/backtest/
          if git diff --cached --quiet; then
            echo "No backtest output changes."
          else
            git commit -m "Publish walk-forward historical backtest"
            git push
          fi
      - name: Publish run summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/historical/backtest/walk_forward_report.json")
          d = json.loads(p.read_text())
          print("## Walk-forward backtest", file=open("$GITHUB_STEP_SUMMARY", "a"))
          with open("$GITHUB_STEP_SUMMARY", "a") as f:
              print(f"Predictions generated: **{d.get('total_predictions', 0)}**\n", file=f)
              print("| Coin | Horizon | N | Accuracy | Brier | Always-up accuracy |", file=f)
              print("|---|---:|---:|---:|---:|---:|", file=f)
              for coin, horizons in d["results"].items():
                  for h, result in horizons.items():
                      if not isinstance(result, dict) or "metrics" not in result: continue
                      m = result["metrics"]
                      print(f"| {coin} | {h} | {m['n']} | {m['directional_accuracy_pct']}% | {m['brier_score']} | {m['baseline_always_up_accuracy_pct']}% |", file=f)
          PY
