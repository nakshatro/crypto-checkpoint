name: Crypto Checkpoint Walk-Forward Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/walk_forward_backtest.py"
      - ".github/workflows/crypto-walk-forward-backtest.yml"
      - "tests/**"
      - "README.md"
      - "RELEASE_NOTES.md"
      - ".github/workflows/release-v1.yml"
      - "data/historical/*.csv.gz"
  workflow_run:
    workflows: ["Crypto Checkpoint Free Historical Backfill"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: crypto-walk-forward-backtest
  cancel-in-progress: false

jobs:
  backtest:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and run walk-forward backtest
        run: |
          python -m py_compile scripts/walk_forward_backtest.py tests/test_backtest.py
          python -m unittest discover -s tests -v
          python scripts/walk_forward_backtest.py
      - name: Commit report and prediction archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historical/backtest/
          if git diff --cached --quiet; then
            echo "No backtest output changes."
          else
            git commit -m "Publish walk-forward historical backtest"
            git pull --rebase origin main
            git push
          fi
      - name: Publish run summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path("data/historical/backtest/walk_forward_report.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              print("# Walk-forward backtest", file=f)
              print(f"Generated predictions: **{d.get('total_predictions', 0)}**", file=f)
              print("", file=f)
              print("| Coin | Horizon | Model | N | Accuracy | Brier | Constant base-rate Brier |", file=f)
              print("|---|---|---|---:|---:|---:|---:|", file=f)
              for coin, item in d["results"].items():
                  for horizon, result in item.get("horizons", {}).items():
                      for model, m in result.get("metrics_by_model", {}).items():
                          print(f"| {coin} | {horizon} | {model} | {m.get('n')} | {m.get('accuracy_pct')}% | {m.get('brier_score')} | {m.get('constant_train_rate_brier')} |", file=f)
          PY
